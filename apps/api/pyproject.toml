[project]
name = "ca-api"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "alembic>=1.13.0",
    "asyncpg>=0.29.0",
    "psycopg2-binary>=2.9.0",
    "google-generativeai>=0.7.0",
    "httpx>=0.27.0",
    "hypothesis>=6.100.0",
    "parallel-web>=1.3.0",
    "pydantic-settings>=2.3.0",
    "cinematography-schema",
]

[dependency-groups]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.uv.sources]
cinematography-schema = { path = "../../packages/cinematography-schema", editable = true }
